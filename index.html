<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把生育时间的犹豫，整理成能一起商量的家庭计划。"><title>什么时候要宝宝，更从容？</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322447b'/%3E%3Cpath d='M8 17h16M16 9v16' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html" class="brand">从容计划<span>FAMILY, AT YOUR PACE</span></a><span class="edition">2026—2030 · 家庭规划版</span></header><main><aside><p class="eyebrow">不是催你做决定</p><h1>什么时候要宝宝，<br>更从容？</h1><p class="intro">先看见你的犹豫，<br>再一起想想，还需要哪些支持。</p><div class="promise">没有“生育资格分”。<br>也不是一道必须答“是”的题。</div><ol id="steps" aria-label="填写步骤"></ol><p class="privacy">无需姓名 · 不上传数据<br>答案仅在当前页面，刷新即清空。</p></aside><section class="surface"><div id="app"></div><p id="status" role="status" aria-live="polite"></p></section></main><footer>辅助家庭讨论，不预测生育能力、受孕日期或孩子命运。<br>是否生育、何时生育，由你们自主决定；个人健康与孕产安排请咨询专业医务人员。</footer><noscript>请启用 JavaScript，以使用本地规划工具。</noscript><script src="engine.js"></script><script src="app.js"></script></body></html>
